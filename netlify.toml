# Kea only: Netlify site keachat · https://kea.chat · GitHub shooper69/KEA
# Do not link this directory to any other Netlify site.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/billing/*"
  to = "/.netlify/functions/billing/:splat"
  status = 200

[[redirects]]
  from = "/api/website-tracker/ingest"
  to = "/.netlify/functions/website-tracker-ingest"
  status = 200

[[redirects]]
  from = "/api/website-tracker/admin"
  to = "/.netlify/functions/website-tracker-admin"
  status = 200

# Existing files in dist/ (favicons, assets) are served first.
# This SPA fallback must not use force=true or it would hide them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
