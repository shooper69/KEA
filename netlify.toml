# Kea only: Netlify site keachat · https://kea.chat · GitHub shooper69/KEA
# Do not link this directory to any other Netlify site.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Baseline security headers for the SPA (and assets under /*).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com; upgrade-insecure-requests"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing/*"
  to = "/.netlify/functions/billing/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/account/delete"
  to = "/.netlify/functions/account-delete"
  status = 200
  force = true

[[redirects]]
  from = "/api/website-tracker/ingest"
  to = "/.netlify/functions/website-tracker-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/api/website-tracker/admin"
  to = "/.netlify/functions/website-tracker-admin"
  status = 200
  force = true

# Serve crawl files from functions so the SPA fallback cannot swallow them.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200
  force = true

# Existing files in dist/ (favicons, assets) are served first.
# Crawler HTML for public pages (unique title, description, canonical).
# These files still boot the React app so people get the full page.
[[redirects]]
  from = "/what-is-kea"
  to = "/what-is-kea.html"
  status = 200
  force = true

[[redirects]]
  from = "/method"
  to = "/method.html"
  status = 200
  force = true

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
  force = true

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms-of-service"
  to = "/terms-of-service.html"
  status = 200
  force = true

[[redirects]]
  from = "/cookie-policy"
  to = "/cookie-policy.html"
  status = 200
  force = true

# This SPA fallback must not use force=true or it would hide them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
